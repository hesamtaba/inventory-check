name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build InventoryChecker for Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean InventoryChecker.spec
          if (!(Test-Path "dist/InventoryChecker/InventoryChecker.exe")) {
            throw "InventoryChecker.exe was not created."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/InventoryChecker/*" -DestinationPath "InventoryChecker_Windows_x64_1.0.0.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: InventoryChecker-Windows-x64-1.0.0
          path: |
            dist/InventoryChecker/**
            InventoryChecker_Windows_x64_1.0.0.zip
          if-no-files-found: error
          retention-days: 30
